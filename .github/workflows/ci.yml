#ci.yml file

name: amazon-prime

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'

    - name: Install dependencies
      run: npm install

    - name: test
      run: npm test

    - name: docker build
      run: |
        docker build -t arunagri/github-amazon .
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u arunagri --password-stdin
        docker push arunagri/github-amazon

    

  